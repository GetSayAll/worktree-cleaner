[package]
name = "worktree-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "worktree_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
# Build and run this crate through the Tauri CLI (`pnpm tauri build` /
# `pnpm tauri dev`), not with a bare `cargo build`. Tauri decides between the
# dev server and the embedded frontend from the `custom-protocol` feature, and
# only the CLI turns it on for a production build. A plain `cargo build` links
# without it, so the window loads `build.devUrl` (localhost:2430) and shows a
# blank page when no dev server is running.
tauri = { version = "2.8", features = ["tray-icon"] }
worktree-core = { path = "../crates/worktree-core" }
