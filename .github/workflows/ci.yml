# The gate for every change.
#
# The repository's own rules are the gate — `pnpm test`, `pnpm lint:rust` and
# the browser checks — so this workflow only runs them. A red build here means
# the rules are red, not that the workflow disagrees with them.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: Test and gate (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - run: pnpm install --frozen-lockfile

      - name: Front-end tests
        run: pnpm test

      - name: Rust gate
        run: pnpm lint:rust

      # The gate checked that the crate compiles and passed its lints, and never
      # ran a single test: the decision tables, the deletion guards and the executor
      # — the whole product — were verified on the developer's machine or not at
      # all. `-p worktree-core` rather than `--workspace`, because the Tauri shell
      # has no tests and linking it would cost minutes.
      - name: Rust tests
        run: cargo test -p worktree-core

      - name: Production build
        run: pnpm build

      - name: Layout in a real browser
        run: pnpm test:layout

      - name: Theme in a real browser
        run: pnpm test:theme

  windows:
    name: Compile and test (Windows)
    # The app ships for Windows, so the code has to compile there. The lints are
    # not run here: a lint that only fires on one platform is a rule that is not
    # yet a rule, and the macOS job is where the gate lives.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - run: pnpm install --frozen-lockfile

      - name: Front-end tests
        run: pnpm test

      # Not `cargo test` here yet. Fifteen of the crate's tests do not pass on
      # Windows: twelve are written against Unix path shapes (`/Users/andy/…` is not
      # an absolute path here, so `accepts_an_ordinary_project_path` and eleven
      # neighbours assert the wrong thing before they reach the rule they are about),
      # two match `/` separators in the evidence they compare, and one drives a
      # generative corpus of Unix paths. They fail loudly rather than being skipped,
      # because a skipped test is coverage this job would claim and not have;
      # porting them is its own change.
      - name: Compile every target
        run: cargo check --workspace --all-targets
